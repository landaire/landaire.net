# The URL the site will be built for
base_url = "https://landaire.net"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

title = "lander's posts"
description = "nothing interesting"

taxonomies = [{ name = "tags" }]

generate_feeds = true

[markdown]
insert_anchor_links = "left"

# Class-based highlighting (emits .z-* classes into giallo.css) so we can boost
# the contrast of Material Ocean's muted tokens in tailwind-input.css. Code
# blocks stay dark in both light and dark mode.
[markdown.highlighting]
style = "class"
theme = "material-theme-ocean"

[extra]
# Put all your custom variables here
author = "@landaire"
github = "landaire"
twitter = "landaire"
license = ""
hide_made_with_line = true
date_format = "%d %b, %Y"
show_base_url = false

[[extra.menu]]
name = ""
url = "/"
